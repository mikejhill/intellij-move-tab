name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Validate the release without creating tags or publishing'
        type: boolean
        default: false
      force-patch:
        description: 'Force a patch bump when no releasable commits exist'
        type: boolean
        default: false
      resume-tag:
        description: 'Finish a release whose tag already exists (e.g. v2.3.0): build, GitHub Release, changelog sync, publish'
        type: string
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

# master is protected (pull request + ci-pass required), so this workflow never pushes to it directly.
# It pushes only the release tag, then opens a release/vX.Y.Z pull request that syncs the promoted
# CHANGELOG back to master. A maintainer merges that PR (bot-opened PRs need their CI run approved).
jobs:
  release:
    if: github.ref == 'refs/heads/master'
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      attestations: write
      artifact-metadata: write
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Determine next version
        if: inputs.resume-tag == ''
        id: semrel
        uses: go-semantic-release/action@v1.24.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          allow-initial-development-versions: true
          force-bump-patch-version: ${{ inputs.force-patch }}
          dry: true
          # Release tags are not on master's first-parent history (the changelog commit reaches master
          # via a rebase-merged PR), so count commits with the compare API instead of walking history.
          custom-arguments: --provider-opt github_use_compare_commits=true

      - name: Resolve version
        id: version
        env:
          RESUME_TAG: ${{ inputs.resume-tag }}
          SEMREL_VERSION: ${{ steps.semrel.outputs.version }}
        shell: bash
        run: |
          if [ -n "$RESUME_TAG" ]; then
            version="${RESUME_TAG#v}"
            git rev-parse -q --verify "refs/tags/v$version" > /dev/null || {
              echo "::error::Tag v$version does not exist"
              exit 1
            }
            # Build exactly what was tagged.
            git checkout -q "v$version"
          else
            version="$SEMREL_VERSION"
            if [ -z "$version" ] && [ -f .version-unreleased ]; then
              version=$(cat .version-unreleased)
            fi
            if [ -z "$version" ]; then
              echo "::error::No releasable commits found. Use force-patch or add feat:/fix: commits."
              exit 1
            fi
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid version '$version'"
            exit 1
          }
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "### Release Version: $version" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate CHANGELOG
        if: inputs.resume-tag == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          pending=$(gh pr list --base master --state open --json headRefName,url \
            --jq '[.[] | select(.headRefName | startswith("release/v")) | .url] | join(" ")')
          if [ -n "$pending" ]; then
            echo "::error::Merge the pending changelog-sync PR(s) first: $pending"
            exit 1
          fi
          grep -q "^## \[Unreleased\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md missing [Unreleased] section"
            exit 1
          }

      - name: Promote CHANGELOG
        if: inputs.resume-tag == ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md
          grep -q "## \[$VERSION\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md promotion failed — version header not found after sed"
            exit 1
          }
          echo "Promoted [Unreleased] → [$VERSION] - $DATE"

      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and Verify
        env:
          CI: true
        run: ./gradlew check verifyPlugin -PpluginVersion=${{ steps.version.outputs.value }}

      - name: Dry-run summary
        if: inputs.dry-run == true
        shell: bash
        run: |
          echo "### Dry Run Complete ✓" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Version **${{ steps.version.outputs.value }}** validated successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "No tags, releases, or artifacts were created." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit CHANGELOG and push tag
        if: inputs.dry-run != true && inputs.resume-tag == ''
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Check for existing GitHub Release
        if: inputs.dry-run != true
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: inputs.dry-run != true
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          # Generate notes only on first creation: when updating an existing release (resume-tag or a
          # re-run), the action appends freshly generated notes to the body, duplicating it.
          generate_release_notes: ${{ steps.existing.outputs.exists != 'true' }}
          files: build/distributions/*.zip

      - name: Attest build provenance
        if: inputs.dry-run != true
        uses: actions/attest@v4
        with:
          subject-path: build/distributions/*.zip

      - name: Sync CHANGELOG to master
        if: inputs.dry-run != true
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          git fetch -q origin master
          if git show origin/master:CHANGELOG.md | grep -q "^## \[$VERSION\]"; then
            echo "master already contains the [$VERSION] changelog section."
            exit 0
          fi
          # Re-apply the promotion on top of current master (rather than pushing the tagged commit) so
          # the branch carries master's latest workflows and any [Unreleased] entries added since.
          branch="release/v$VERSION"
          date=$(git show "v$VERSION:CHANGELOG.md" | grep -oP "^## \[$VERSION\] - \K[0-9-]+")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -q -B "$branch" origin/master
          sed -i "s/^## \[Unreleased\]$/## [Unreleased]\n\n## [$VERSION] - $date/" CHANGELOG.md
          grep -q "^## \[$VERSION\] - $date" CHANGELOG.md || {
            echo "::error::Could not promote CHANGELOG on master for $VERSION"
            exit 1
          }
          git commit -q -am "chore(release): v$VERSION"
          git push --force origin "$branch"
          pr_url=$(gh pr list --head "$branch" --base master --state open --json url --jq '.[0].url')
          if [ -z "$pr_url" ]; then
            pr_url=$(gh pr create --base master --head "$branch" \
              --title "chore(release): v$VERSION" \
              --body "Syncs the CHANGELOG promotion for v$VERSION back to master. Opened by the release workflow; approve its workflow run (or close and reopen this PR) and merge it before the next release.")
          fi
          {
            echo "### Action required: merge $pr_url"
            echo ""
            echo "Bot-opened PRs need a maintainer to approve their CI run (or close and reopen the PR) before \`ci-pass\` can satisfy branch protection."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Merge $pr_url to sync the v$VERSION CHANGELOG to master"

  publish:
    needs: release
    if: inputs.dry-run != true
    name: Publish to JetBrains Marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment: jetbrains-marketplace
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: v${{ needs.release.outputs.version }}
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          java-version: 21
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Publish Plugin
        env:
          publishToken: ${{ secrets.JETBRAINS_HUB_TOKEN }}
        run: ./gradlew publishPlugin -PpluginVersion=${{ needs.release.outputs.version }}
