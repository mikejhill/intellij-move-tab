name: Build and Verify Plugin

on:
  push:
    branches: ['*']
    tags-ignore: ['*']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  pull_request:
    branches: ['*']
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  markdown:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: '**/*.md'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: 21
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
      - name: Build, test, and verify
        # check runs unit/integration tests against both the minimum (test) and newest
        # (testLatestIde) supported IDEs and enforces the Kover coverage floor.
        env:
          CI: true
        run: |
          ./gradlew check verifyPlugin koverXmlReport koverLog
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          report=build/reports/kover/report.xml
          [ -f "$report" ] || exit 0
          line=$(grep -oE '<counter type="LINE" missed="[0-9]+" covered="[0-9]+"/>' "$report" | tail -1)
          missed=$(echo "$line" | grep -oP 'missed="\K[0-9]+')
          covered=$(echo "$line" | grep -oP 'covered="\K[0-9]+')
          pct=$(awk "BEGIN { printf \"%.1f\", 100 * $covered / ($covered + $missed) }")
          echo "### Line coverage: ${pct}% (${covered}/$((covered + missed)) lines)" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/kover/
            build/reports/pluginVerifier/
          if-no-files-found: ignore

  ci-pass:
    if: always()
    needs: [commit-lint, markdown, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs were cancelled"
            exit 1
          fi
