name: CodeQL Analysis

on:
  push:
    branches: [ '*' ]
    tags-ignore: [ '*' ]
  pull_request:
    branches: [ '*' ]
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java
        uses: actions/setup-java@v6.1.0
        with:
          java-version: 21
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
          config-file: .github/codeql/codeql-config.yml
      - name: Build
        env:
          CI: true
        # The CodeQL Kotlin extractor runs inside the Kotlin daemon and needs far more heap than a
        # normal compile (it exhausts the default heap with the IntelliJ classpath).
        run: |
          ./gradlew :assemble -Pkotlin.daemon.jvmargs=-Xmx8g
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.39.0
        with:
          category: /language:java-kotlin
