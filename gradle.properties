# Exclude Kotlin stdlib from bundle (already provided at runtime by IntelliJ)
kotlin.stdlib.default.dependency = false

# Enable configuration cache for faster Gradle setup
org.gradle.configuration-cache=true

# IntelliJ IDEA versions used for building, testing, and verification.
# platformVersion is the minimum supported IDE (keep in sync with since-build in plugin.xml).
# platformVersionLatest is the newest released IDE; bump it when JetBrains ships a new release.
platformVersion = 2025.3.6.1
platformVersionLatest = 2026.2.3

# IJPGP 2.19+ adds every bundled plugin to the test classpath for IntelliJ 2026.2+, which loads the
# licensed Ultimate module and fails test-application startup without a subscription key. This plugin
# depends only on the platform, so keep the test classpath to the platform itself.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathEnabled = false
